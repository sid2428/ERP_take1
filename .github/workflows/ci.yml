name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/unit
        env:
          NODE_ENV: test
          APP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_test
          DATABASE_SSL: "false"
          SESSION_SECRET: ci-only-session-secret-not-used-outside-tests-32chars
